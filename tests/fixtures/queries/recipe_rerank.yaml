# Recipe: rerank candidates
type: rank
from: item
retrieve:
  - type: candidate_ids
    item_ids: $parameter.candidate_item_ids
    name: candidates
score:
  type: score_ensemble
  value_model: click_through_rate
  input_user_id: $parameter.user_id
  output_alias: ctr
  preserve_order: false
limit: 10
